# .harness/project.toml - rag-pipeline-v1 (reviewed by the owner at enrolment)
schema = 1
name = "rag-pipeline-v1"
check = ".venv/bin/python -m pytest tests/ -q"
lint = ""
python = ".venv/bin/python"

# CLAUDE.md hard rule: never commit data/, any PDF, .env, chroma_db/ (corpus is copyrighted; repo is public).
never_commit = [
  "^data/",
  "\\.pdf$",
  "^chroma_db/",
  "^chroma_db_arm_[^/]*/",
  "^sample_chroma_db/",
  "^eval/bakeoff/",
  "^logs/",
  "^Tutorial_Docs_for_review/",
  "^eval/judge_review\\.jsonl$",
  "^eval/private/",
]
never_commit_allow = []

# Never sent to Codex or third-party workers (corpus text, indexes, held-out questions, logs).
restricted_read = [
  "data", "chroma_db", "chroma_db_arm_*", "sample_chroma_db", "eval/bakeoff",
  "eval/heldout_set.jsonl", "eval/judge_review.jsonl", "logs", "Tutorial_Docs_for_review",
  ".env*", "*.pdf", "eval/private",
]
allow_ignored_adds = false
# Phase 16A-1 [W] lane (spec item list "worker_allow"); synthetic fixtures only.
worker_allow = [
  "src/eval_sets.py", "src/eval_schema.py", "src/eval_privacy.py", "src/eval_scoring.py", "src/eval_split.py",
  "src/eval_stats.py", "src/expansion_artifact.py", "src/spend.py", "src/text_utils.py", "src/chunker.py",
  "scripts/scan_leaks.py", "scripts/validate_eval_set.py",
  "tests/test_p16w_*.py", "tests/fixtures/p16w_*",
  # read-only import dependencies (spec: worker_allow "plus" these)
  "src/generator.py", "src/grounding.py", "src/render.py", "tests/conftest.py",
]
codex_clause = "Do NOT read data/, chroma_db/, chroma_db_arm_*/, eval/bakeoff/, eval/private/, or held-out eval files."
